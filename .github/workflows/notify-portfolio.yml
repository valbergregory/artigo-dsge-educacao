# Instalado em .github/workflows/notify-portfolio.yml em cada repositório de
# pesquisa rastreado pela página pessoal (11/09/2026). Após um push na branch
# principal ou a publicação de uma release, ele envia o evento
# `portfolio-update` ao repositório do site, que reconstrói a página com os
# metadados novos.
#
# Requisitos:
#  1. Criar um fine-grained personal access token com acesso APENAS ao repositório
#     valbergregory/valbergregory.github.io e permissão "Contents: Read and write"
#     (necessária para repository_dispatch). Nenhuma outra permissão.
#  2. Salvar o token como secret chamado PORTFOLIO_SYNC_TOKEN no repositório de
#     pesquisa (Settings → Secrets and variables → Actions) — ou, para todos de
#     uma vez, rodar scripts/set-portfolio-secret.ps1 no repositório do site.
#  3. Nunca gravar o token em arquivo, log ou commit.
#
# Sem este workflow a página continua sendo atualizada pelo agendamento
# periódico (a cada seis horas).

name: Notify personal website

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # Não executa em forks nem quando o secret não está configurado.
    if: ${{ github.repository_owner == 'valbergregory' }}
    steps:
      - name: Disparar rebuild da página pessoal
        env:
          TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          SOURCE: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PORTFOLIO_SYNC_TOKEN não configurado; o agendamento periódico cuidará da atualização."
            exit 0
          fi
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/valbergregory/valbergregory.github.io/dispatches \
            -d "{\"event_type\":\"portfolio-update\",\"client_payload\":{\"source\":\"$SOURCE\"}}"
